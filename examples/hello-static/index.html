<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Static</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 48px; }
    h1 { color: #2563eb; }
    .card { display: inline-block; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px 40px; }

  <div class="card">
    <h1>Hello from a plain website 👋</h1>

  </div>
</body>
</html>
